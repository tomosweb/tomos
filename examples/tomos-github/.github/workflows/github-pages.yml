name: Tomos GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # This is the Phase 5 development baseline. Update it deliberately to a
  # Phase 5-compatible Tomos tag when one is released.
  TOMOS_VERSION: 13e6d8f4634e687ae774a0e3a6d483f6a095b832
  TOMOS_REPOSITORY: https://github.com/tomosweb/tomos.git
  OUTPUT_DIR: build/tomos-github-pages

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      setup_complete: ${{ steps.setup_status.outputs.ready }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Check whether Pages setup is complete
        id: setup_status
        shell: bash
        run: |
          if [[ -f .tomos-setup-complete ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none

      - name: Fetch pinned Tomos Publishing Core
        shell: bash
        run: |
          set -euo pipefail
          tomos_root="$RUNNER_TEMP/tomos-core"
          git clone --depth 1 "$TOMOS_REPOSITORY" "$tomos_root"
          git -C "$tomos_root" fetch --depth 1 origin "$TOMOS_VERSION"
          git -C "$tomos_root" checkout --detach "$TOMOS_VERSION"
          test "$(git -C "$tomos_root" rev-parse HEAD)" = "$TOMOS_VERSION"
          echo "TOMOS_ROOT=$tomos_root" >> "$GITHUB_ENV"

      - name: Run Static Build contract
        shell: bash
        run: php "$TOMOS_ROOT/tests/static_site_builder_check.php"

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/assets"
          cp "$TOMOS_ROOT/assets/tomos-static-search.js" "$GITHUB_WORKSPACE/assets/tomos-static-search.js"
          rm -rf "$OUTPUT_DIR"
          php "$TOMOS_ROOT/tools/build-static-site.php" \
            --config="$GITHUB_WORKSPACE/tomos.config.php" \
            --tomos-root="$TOMOS_ROOT" \
            --output="$OUTPUT_DIR"

      - name: Verify Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OUTPUT_DIR/index.html"
          test -f "$OUTPUT_DIR/404.html"
          test -f "$OUTPUT_DIR/search-index.json"
          test -f "$OUTPUT_DIR/feed.xml"
          test -f "$OUTPUT_DIR/sitemap.xml"
          test -f "$OUTPUT_DIR/robots.txt"
          test -f "$OUTPUT_DIR/assets/tomos-static-search.js"
          test -f "$OUTPUT_DIR/themes/tomos-minimal/assets/style.css"
          test ! -e "$OUTPUT_DIR/tomos.config.php"
          test ! -e "$OUTPUT_DIR/tomos-site-name.txt"
          test ! -e "$OUTPUT_DIR/.tomos-setup-complete"
          test ! -e "$OUTPUT_DIR/core"
          test ! -e "$OUTPUT_DIR/tools"
          test ! -e "$OUTPUT_DIR/tests"
          test ! -e "$OUTPUT_DIR/.github"
          test -z "$(find "$OUTPUT_DIR" -type f -name '*.md' -print -quit)"
          ! grep -F 'Draft' "$OUTPUT_DIR/search-index.json"
          ! grep -F '/draft' "$OUTPUT_DIR/sitemap.xml"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUTPUT_DIR }}

  deploy:
    if: needs.build.outputs.setup_complete == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
