<article class="page-card">
  {{{ nav.breadcrumbs }}}

  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {{{ page.meta_html }}}
  </header>

  <!-- Markdown本文、画像、wiki link、Core生成YouTube HTMLはここへ渡されます。 -->
  <div class="page-content">
    {{{ page.content }}}
    {{{ page.folder_pages_html }}}
  </div>

  {{{ page.tags_html }}}
</article>
