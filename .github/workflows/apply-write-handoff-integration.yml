name: Apply Write Handoff Integration

on:
  push:
    branches:
      - feature/write-handoff-integration
    paths:
      - .github/workflows/apply-write-handoff-integration.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply Post Write handoff integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/write-handoff-integration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply exact Post patch
        run: python tools/apply-write-handoff-integration.py
      - name: Remove one-shot patch files
        run: rm tools/apply-write-handoff-integration.py .github/workflows/apply-write-handoff-integration.yml
      - name: Commit integrated Post UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Apply Post Write handoff integration"
          git push origin HEAD:feature/write-handoff-integration
