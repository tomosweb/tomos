name: Clean public passkey documentation

on:
  push:
    branches:
      - feature/passkey-auth
    paths:
      - .github/workflows/apply-passkey-doc-cleanup.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-passkey-doc-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/passkey-auth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/passkey-auth
          fetch-depth: 0

      - name: Remove implementation verification history from public spec
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/security/passkey-auth-spec.md')
          text = path.read_text(encoding='utf-8')

          start = text.index('## 2. PoCで確認済みの前提')
          end = text.index('## 3. 基本方針')
          replacement = '''## 2. 設計上の前提

パスキーはWebAuthnの標準的な登録・認証フローを用い、既存のTomos Post認証済みセッションへ接続する。

本実装では単一credentialを前提とせず、複数パスキー、永続credential保存、管理用合言葉へのフォールバック、合言葉再設定、サーバー所有確認による初回復旧を製品仕様として扱う。

'''
          text = text[:start] + replacement + text[end:]

          old_reason = '- PoCで実開発環境、Mac Chrome、Mac Safari、iPhone Safariの登録・認証に成功した\n'
          if old_reason not in text:
              raise SystemExit('library adoption history line not found')
          text = text.replace(old_reason, '', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit cleanup and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-passkey-doc-cleanup.yml
          git add docs/security/passkey-auth-spec.md
          git commit -m "Remove verification history from public passkey spec"
          git push origin HEAD:feature/passkey-auth
