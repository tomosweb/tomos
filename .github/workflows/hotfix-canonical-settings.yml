name: One-time canonical site settings hotfix

on:
  push:
    branches:
      - hotfix/0.3.1-site-settings-canonical
    paths:
      - .github/workflows/hotfix-canonical-settings.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/0.3.1-site-settings-canonical
      - name: Canonicalize site settings entrypoint
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('post/index.php')
          text = path.read_text()
          old = "/post/settings/"
          new = "/post/site-settings.php"
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'expected 3 site settings routes, found {count}')
          path.write_text(text.replace(old, new))
          PY
          grep -F "/post/site-settings.php" post/index.php
          if grep -Fq "/post/settings/" post/index.php; then
            echo "legacy route remains in canonical Tomos Post navigation" >&2
            exit 1
          fi
      - name: Remove one-time workflow and commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hotfix-canonical-settings.yml
          git add post/index.php
          git commit -m "Make flat site settings entrypoint canonical"
          git push origin HEAD:hotfix/0.3.1-site-settings-canonical
