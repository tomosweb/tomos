name: Passkey compatibility

on:
  push:
    branches:
      - feature/passkey-auth
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.0', '8.2', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: openssl, mbstring, gd
          coverage: none
          tools: composer:v2

      - name: PHP version
        run: php -v

      - name: Syntax check without bundled vendor
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -path './core/webauthn/vendor' -prune -o -name '*.php' -print0)

      - name: Passkey PHP fallback checks
        run: php tests/passkey_php_compatibility_check.php

      - name: ImageProcessor GD compatibility check
        run: php -d error_reporting=E_ALL tests/image_processor_php85_compatibility_check.php

      - name: Install pinned WebAuthn runtime
        if: matrix.php-version != '7.4'
        run: composer install --working-dir=core/webauthn --no-dev --prefer-dist --no-interaction --classmap-authoritative

      - name: Verify distribution runtime
        if: matrix.php-version != '7.4'
        run: php tests/passkey_distribution_check.php

      - name: Build distribution ZIP with WebAuthn runtime
        if: matrix.php-version == '8.2'
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build-distribution.sh
          version="$(tr -d '[:space:]' < VERSION)"
          zip_path="build/tomos-${version}.zip"
          test -f "$zip_path"
          test -f build/tomos/core/webauthn/vendor/autoload.php
          test -f build/tomos/core/webauthn/vendor/lbuchs/webauthn/src/WebAuthn.php
          unzip -Z1 "$zip_path" | grep -Fx 'core/webauthn/vendor/autoload.php'
          unzip -Z1 "$zip_path" | grep -Fx 'core/webauthn/vendor/lbuchs/webauthn/src/WebAuthn.php'
          php -r '
            $zip = new ZipArchive();
            $path = "build/tomos-" . trim(file_get_contents("VERSION")) . ".zip";
            if ($zip->open($path) !== true) { exit(1); }
            $autoload = $zip->getFromName("core/webauthn/vendor/autoload.php");
            $runtime = $zip->getFromName("core/webauthn/vendor/lbuchs/webauthn/src/WebAuthn.php");
            $zip->close();
            if (!is_string($autoload) || $autoload === "" || !is_string($runtime) || $runtime === "") { exit(1); }
          '

      - name: Run passkey checks
        if: matrix.php-version != '7.4'
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/passkey_*_check.php; do
            [ -f "$test" ] || continue
            if [ "$test" = "tests/passkey_distribution_check.php" ] || [ "$test" = "tests/passkey_php_compatibility_check.php" ]; then
              continue
            fi
            php "$test"
          done
