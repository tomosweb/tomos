name: Theme folder pill navigation

on:
  pull_request:
    paths:
      - '.github/workflows/theme-folder-pill.yml'
      - 'themes/tomos-quiet/**'
      - 'themes/tomos-index/**'
      - 'tools/build-theme-test-zips.sh'
      - 'tests/theme_folder_pill_navigation_check.php'
      - 'tests/theme_folder_pill_package_update_check.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip

      - name: Build test Theme ZIPs
        run: tools/build-theme-test-zips.sh --output-dir="$RUNNER_TEMP/theme-test"

      - name: Verify Theme UI and pagination
        run: php tests/theme_folder_pill_navigation_check.php

      - name: Verify Theme ZIP update and active rendering
        run: |
          php tests/theme_folder_pill_package_update_check.php \
            --quiet="$RUNNER_TEMP/theme-test/tomos-quiet-1.0.4-test.zip" \
            --index="$RUNNER_TEMP/theme-test/tomos-index-1.0.5-test.zip"

      - name: Upload test Theme ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: tomos-theme-folder-pill-test-zips
          path: ${{ runner.temp }}/theme-test/*.zip
          if-no-files-found: error
          retention-days: 14
