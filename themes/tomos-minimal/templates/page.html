<article class="page-card">
  {{{ nav.breadcrumbs }}}

  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
    {{{ page.meta_html }}}
    <p class="page-description">{{ page.description }}</p>
  </header>

  <div class="page-content">
    {{{ page.content }}}
    {{{ page.folder_pages_html }}}
  </div>

  {{{ page.tags_html }}}
</article>
