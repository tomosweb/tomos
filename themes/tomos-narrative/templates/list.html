<section class="narrative-intro" aria-label="プロフィール">
  <p class="narrative-name">{{ site.name }}</p>
  {{# site.description }}<p class="narrative-description">{{ site.description }}</p>{{/ site.description }}
  <nav class="narrative-profile-links" aria-label="プロフィールリンク">
    <a href="{{ nav.about_url }}">プロフィール</a>{{# site.feed_url }}<a href="{{ site.feed_url }}">RSS</a>{{/ site.feed_url }}
  </nav>
</section>

<section class="narrative-list-page">
  {{{ nav.breadcrumbs }}}
  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
    {{# page.description }}<p class="page-description">{{ page.description }}</p>{{/ page.description }}
  </header>
  {{{ list.pages }}}
</section>
