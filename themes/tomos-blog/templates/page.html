<div class="creator-article-layout">
  <aside class="creator-author-panel">
    <div class="creator-avatar creator-avatar-small"><img src="{{ theme.asset_url }}/profile.png?v=1.1.1" alt=""></div>
    <p class="creator-kicker">WRITTEN BY</p>
    <h2><a href="{{ site.home_url }}">{{ site.name }}</a></h2>
    <p>{{ site.description }}</p>
    <nav aria-label="著者リンク">
      <a href="{{ nav.about_url }}">プロフィール</a>
      {{# site.feed_url }}<a href="{{ site.feed_url }}">RSS</a>{{/ site.feed_url }}
    </nav>
  </aside>

  <article class="creator-article">
    {{{ nav.breadcrumbs }}}
    <header class="page-header">
      <p class="creator-kicker">STORY</p>
      <h1 class="page-title">{{ page.title }}</h1>
      {{{ page.meta_html }}}
    </header>

    <div class="page-content">
      {{{ page.content }}}
    </div>

    {{{ page.folder_pages_html }}}

    {{{ page.tags_html }}}

  </article>
</div>
