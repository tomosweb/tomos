<section class="index-profile" aria-label="プロフィール">
  <p class="index-profile-name">{{ site.name }}</p>
  {{# site.description }}<p class="index-profile-description">{{ site.description }}</p>{{/ site.description }}
  <nav class="index-profile-links" aria-label="プロフィールリンク"><a href="{{ nav.about_url }}">プロフィール</a>{{# site.feed_url }}<a href="{{ site.feed_url }}">RSS</a>{{/ site.feed_url }}</nav>
</section>

<section class="index-list-page">
  {{{ nav.breadcrumbs }}}
  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
    {{# page.description }}<p class="page-description">{{ page.description }}</p>{{/ page.description }}
  </header>
  {{{ list.pages }}}
</section>
